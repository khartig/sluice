# Publishing to npm, and the artifacts attached to the GitHub Release for
# each version. Modeled on Adhal's release.yml, for one package.
#
# PUBLISH. Publishing a GitHub Release publishes `sluice-relay` to npm
# through npm trusted publishing (OIDC). No npm token exists anywhere: npm
# trusts this file, `release.yml`, in this repository, running in the
# `npm` environment, and nothing else. The environment's required
# reviewer approves each publish. Because the repository and the package
# are public, npm attaches a provenance attestation without being asked.
#
# npm configures a trusted publisher only on a package that already
# exists, so the first version is published by hand (docs/RELEASING.md),
# and this workflow publishes every version after it.
#
# The tarball is packed once, and that exact file is hashed, attested,
# published, and attached. After publishing, the job checks that the
# registry's SHA-512 is the hash of the file it packed, so the checksums
# on the release are the bytes npm serves. The tarball has a GitHub build
# provenance attestation, signed through Sigstore:
#
#   gh attestation verify sluice-relay-0.2.0.tgz --repo khartig/sluice
#
# Publishing runs only on a release event, never by hand, so running the
# workflow by hand for an old tag cannot try to republish it.
#
# SBOM. A CycloneDX SBOM of the production dependency tree in
# pnpm-lock.yaml, as an application. It describes the tree that was
# locked and tested; the package ships no lockfile, and its dependencies'
# own dependencies are ranges, so an install can resolve newer versions.
#
# The commands are inline rather than in package.json scripts, so that
# running this by hand for an older tag does not depend on that tag's
# scripts.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach an SBOM for, such as v0.1.0
        required: true

jobs:
  publish:
    name: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    # npm's trusted publisher for the package names this environment, so a
    # run outside it cannot publish. Its required reviewer is the human
    # step between publishing a release and publishing to npm.
    environment: npm
    permissions:
      # To upload the tarball and checksums to the release.
      contents: write
      # For npm's OIDC token exchange, and for the Sigstore certificate
      # that signs the attestation.
      id-token: write
      # To store the attestation.
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency cache in a job that publishes, as npm advises: a
      # poisoned cache entry would go straight into a release.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: check the tag matches the package
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match sluice-relay $version"
            exit 1
          fi

      # CI has already run on this commit. A last check on the exact tree
      # being packed.
      - run: pnpm typecheck
      - run: pnpm test

      - name: pack
        run: |
          pnpm pack --out 'dist/%s-%v.tgz'
          cd dist
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS

      # Attested before publishing, so no version reaches npm without an
      # attestation.
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tgz

      # The tarball, not the directory, so the bytes published are the bytes
      # hashed and attested. --no-git-checks because a tag checkout is a
      # detached HEAD. A version already on npm is skipped, so a re-run
      # after a later step failed does not fail here; the next step still
      # checks it, since `pnpm pack` writes fixed timestamps.
      - name: publish to npm
        run: |
          version="${TAG#v}"
          if npm view "sluice-relay@$version" version >/dev/null 2>&1; then
            echo "sluice-relay@$version is already on npm, skipping"
          else
            pnpm publish "dist/sluice-relay-$version.tgz" --access public --no-git-checks
          fi

      # --prefer-online because the publish step's `npm view` cached the
      # package as it was before this version (Adhal's v0.1.1 run failed on
      # exactly that). The loop waits up to three minutes for the registry
      # to serve the new version.
      - name: check npm serves the bytes that were packed
        run: |
          version="${TAG#v}"
          want="sha512-$(openssl dgst -sha512 -binary "dist/sluice-relay-$version.tgz" | base64 -w0)"
          got=""
          for _ in $(seq 36); do
            got=$(npm view --prefer-online "sluice-relay@$version" dist.integrity 2>/dev/null) && [ -n "$got" ] && break
            sleep 5
          done
          if [ "$got" != "$want" ]; then
            echo "::error::sluice-relay@$version: registry has '$got', packed '$want'"
            exit 1
          fi
          echo "sluice-relay@$version  $got"
          slsa=$(npm view --prefer-online "sluice-relay@$version" dist.attestations.provenance.predicateType)
          if [ -z "$slsa" ]; then
            echo "::error::sluice-relay@$version was published without a provenance attestation"
            exit 1
          fi
          echo "  provenance: $slsa"

      - name: attach the tarball and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.tgz dist/SHA256SUMS

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    permissions:
      # To upload assets to the release, and nothing else.
      contents: write
    env:
      # Through env rather than ${{ }} in the scripts, so a tag name is
      # never spliced into shell source.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The install puts the packages in the store, where `pnpm sbom` reads
      # their licenses.
      - run: pnpm install --frozen-lockfile

      - name: check the tag matches the package
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match sluice-relay $version"
            exit 1
          fi

      - name: generate the SBOM
        run: |
          pnpm sbom --sbom-format cyclonedx --prod --sbom-type application \
            --out 'sbom/%s-%v.cdx.json'
          ls -l sbom

      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "sbom/sluice-relay-$version.cdx.json"
